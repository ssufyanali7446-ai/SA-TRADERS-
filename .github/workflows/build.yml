name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Auto Extract ZIP and Find Project Files
        run: |
          set -e
          echo "=== Checking for ZIP files ==="
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE. Extracting..."
            unzip -o "$ZIP_FILE" -d extracted_project
          fi

          echo "=== Listing Repository Structure ==="
          find . -maxdepth 3 -not -path '*/.*'

          echo "=== Searching for pubspec.yaml ==="
          PUBSPEC=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)

          if [ -n "$PUBSPEC" ]; then
            echo "Found Flutter project at: $PUBSPEC"
            DIR=$(dirname "$PUBSPEC")
            cd "$DIR"
            flutter pub get
            flutter build apk --release
          else
            echo "No pubspec.yaml found. Checking for gradlew..."
            GRADLEW=$(find . -name "gradlew" -not -path "*/.*" | head -n 1)
            if [ -n "$GRADLEW" ]; then
              echo "Found gradlew at: $GRADLEW"
              DIR=$(dirname "$GRADLEW")
              cd "$DIR"
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              echo "ERROR: Neither Flutter nor Gradle project files exist."
              exit 1
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: '**/build/outputs/**/*.apk'
