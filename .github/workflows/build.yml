name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'

      - name: Build APK (Auto Detect)
        run: |
          set -e
          echo "=== Searching for project files ==="
          
          # Find pubspec.yaml
          PUBSPEC=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          
          if [ -n "$PUBSPEC" ]; then
            echo "Found Flutter project at: $PUBSPEC"
            DIR=$(dirname "$PUBSPEC")
            cd "$DIR"
            flutter pub get
            flutter build apk --release
          else
            echo "No pubspec.yaml found. Checking for Gradle..."
            GRADLEW=$(find . -name "gradlew" -not -path "*/.*" | head -n 1)
            if [ -n "$GRADLEW" ]; then
              echo "Found gradlew at: $GRADLEW"
              DIR=$(dirname "$GRADLEW")
              cd "$DIR"
              chmod +x gradlew
              ./gradlew assembleDebug
            else
              echo "Error: Could not find Flutter or Gradle project files."
              exit 1
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            **/build/outputs/flutter-apk/*.apk
            **/build/outputs/apk/**/*.apk
